[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-governance-assistant"
version = "0.4.0"
description = "MCP interface for the reusable AI governance decision service"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Dan Van Beek" }]
dependencies = [
  "mcp>=1.12,<2",
  "uvicorn>=0.30,<1",
  "ai-governance-control-plane @ git+https://github.com/danvanbeeksec/ai-governance-control-plane.git@a6eae7a62dfde13c241bb620465e0b010f208518",
]

[project.optional-dependencies]
web = ["streamlit>=1.41,<2"]

[project.scripts]
ai-governance-assistant = "ai_governance_assistant.server:main"
ai-governance-assistant-http = "ai_governance_assistant.http_server:main"
ai-governance-assistant-web = "ai_governance_assistant.web_launcher:main"

[project.urls]
Repository = "https://github.com/danvanbeeksec/ai-governance-assistant"
Issues = "https://github.com/danvanbeeksec/ai-governance-assistant/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_governance_assistant"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
pythonpath = ["src"]
