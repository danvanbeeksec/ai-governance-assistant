[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-governance-assistant"
version = "0.1.1"
description = "MCP interface for the reusable AI governance decision service"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.12,<2",
  "ai-governance-control-plane @ git+https://github.com/danvanbeeksec/ai-governance-control-plane.git@623a742854fba1f9c40aa7af20455ac9f378fa18",
]

[project.scripts]
ai-governance-assistant = "ai_governance_assistant.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_governance_assistant"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
pythonpath = ["src"]
