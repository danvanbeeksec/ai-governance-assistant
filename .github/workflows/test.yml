name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest
      - name: Compile Python sources
        run: python -m compileall -q src
      - name: Build installable Assistant wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Build local distribution image
        run: docker build -t ai-governance-assistant:test .
