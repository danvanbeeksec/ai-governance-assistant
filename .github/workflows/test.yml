name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest
      - name: Compile Python sources
        run: python -m compileall -q src
      - name: Build installable Assistant wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Build local distribution image
        run: docker build -t ai-governance-assistant:test .
      - name: Verify hosted HTTP container
        env:
          AI_GOVERNANCE_API_KEY: synthetic-ci-api-key
        run: |
          trap 'docker rm --force governance-http >/dev/null 2>&1 || true' EXIT
          docker run --detach --name governance-http --publish 8000:8000 \
            --env AI_GOVERNANCE_API_KEY \
            ai-governance-assistant:test ai-governance-assistant-http
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/readyz; then
              exit 0
            fi
            sleep 1
          done
          docker logs governance-http
          exit 1
